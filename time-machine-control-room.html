<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06090b"><meta name="description" content="宇宙船コントロールルーム タイムマシン起動テスト"><title>タイムマシン制御｜コントロールルーム</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/story/pdf-image-2.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="絶滅脱出"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="progress.css?v=20260728-1"><link rel="stylesheet" href="time-machine-control-room.css?v=20260728-2"></head>
<body class="time-control-page" data-game-screen="6">
  <main class="time-console">
    <header class="time-console-header"><div><span>TIME TRANSFER CONTROL SYSTEM</span><h1>コントロールルーム</h1></div><a href="screen6.html">コントロールルームから出る <i aria-hidden="true">×</i></a></header>
    <section class="time-console-status" aria-labelledby="time-console-title"><div><p>TYPE 5 / STARTUP SEQUENCE TEST</p><h2 id="time-console-title">5色のレバーを順番に引け</h2><span>レバーを引くと、直前のレバーは自動的に上へ戻ります</span></div><div class="time-indicator" id="time-indicator"><i></i><span>SEQUENCE STANDBY</span></div></section>
    <section class="lever-console">
      <div class="transfer-settings" aria-label="タイムマシン設定">
        <div class="transfer-setting transfer-target"><span>装着対象</span><strong>宇宙船 <small>※固定</small></strong></div>
        <label class="transfer-setting" id="travel-time-field"><span>移動時間</span><input id="travel-time" type="text" inputmode="text" autocomplete="off" placeholder="移動時間を入力" aria-describedby="time-feedback"></label>
      </div>
      <div class="lever-bank" id="lever-bank" aria-label="タイムマシン起動用の5色レバー">
        <button class="time-lever color-red" type="button" data-lever-index="0" data-color-name="赤" aria-pressed="false"><span class="lever-slot"><i></i></span><strong>赤</strong><small>RED / 01</small></button>
        <button class="time-lever color-blue" type="button" data-lever-index="1" data-color-name="青" aria-pressed="false"><span class="lever-slot"><i></i></span><strong>青</strong><small>BLUE / 02</small></button>
        <button class="time-lever color-yellow" type="button" data-lever-index="2" data-color-name="黄" aria-pressed="false"><span class="lever-slot"><i></i></span><strong>黄</strong><small>YELLOW / 03</small></button>
        <button class="time-lever color-pink" type="button" data-lever-index="3" data-color-name="ピンク" aria-pressed="false"><span class="lever-slot"><i></i></span><strong>ピンク</strong><small>PINK / 04</small></button>
        <button class="time-lever color-black" type="button" data-lever-index="4" data-color-name="黒" aria-pressed="false"><span class="lever-slot"><i></i></span><strong>黒</strong><small>BLACK / 05</small></button>
      </div>
      <div class="sequence-readout"><span>INPUT SEQUENCE</span><ol id="sequence-slots"><li>—</li><li>—</li><li>—</li><li>—</li><li>—</li></ol><div class="lever-actions"><button class="lever-reset" id="lever-reset" type="button">入力状態を解除</button><button class="sequence-judge" id="sequence-judge" type="button">判定する</button></div><p id="time-feedback" aria-live="polite">移動時間を入力し、1本目のレバーを引いてください</p></div>
    </section>
    <section class="time-success" id="time-success" hidden aria-live="assertive"><div class="time-success-icon" aria-hidden="true"><i></i></div><p>STARTUP SEQUENCE VERIFIED</p><h2>これでタイムマシンが起動できそうだ</h2><a href="screen7.html"><span>次に進む</span><i aria-hidden="true">→</i></a></section>
</main><script src="progress.js?v=20260728-1"></script><script src="time-machine-control-room.js?v=20260728-2"></script>
</body></html>
